<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Shop PC 正在启动</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        color: #f7f9ff;
        background: transparent;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      body {
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .splash-card {
        position: relative;
        width: 680px;
        height: 400px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 224px 1fr;
        align-items: center;
        gap: 28px;
        padding: 46px 54px;
        border: 1px solid rgba(130, 174, 255, 0.26);
        border-radius: 32px;
        background:
          radial-gradient(circle at 18% 28%, rgba(40, 118, 255, 0.3), transparent 37%),
          radial-gradient(circle at 85% 78%, rgba(116, 70, 255, 0.24), transparent 38%),
          linear-gradient(145deg, rgba(13, 29, 55, 0.98), rgba(5, 14, 28, 0.99));
        box-shadow:
          0 34px 90px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        animation: card-enter 620ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .splash-card::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          115deg,
          transparent 20%,
          rgba(255, 255, 255, 0.035) 42%,
          transparent 62%
        );
        transform: translateX(-100%);
        animation: light-sweep 2.4s ease-in-out infinite;
      }

      .logo-stage {
        position: relative;
        width: 190px;
        height: 190px;
        display: grid;
        place-items: center;
      }

      .logo-stage::before,
      .logo-stage::after {
        content: "";
        position: absolute;
        border-radius: 42px;
      }

      .logo-stage::before {
        inset: -9px;
        background: conic-gradient(
          from 0deg,
          rgba(40, 118, 255, 0),
          #2876ff,
          #7446ff,
          rgba(116, 70, 255, 0)
        );
        filter: blur(2px);
        animation: ring-spin 3.8s linear infinite;
      }

      .logo-stage::after {
        inset: -4px;
        background: #07111f;
        border-radius: 38px;
      }

      .app-icon {
        position: relative;
        z-index: 1;
        width: 176px;
        height: 176px;
        object-fit: contain;
        filter: drop-shadow(0 18px 32px rgba(40, 118, 255, 0.28));
        animation: logo-float 2.2s ease-in-out infinite;
      }

      .content {
        position: relative;
        z-index: 1;
        min-width: 0;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #69a8ff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.2em;
      }

      h1 {
        margin: 0;
        font-size: 38px;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 15px 0 30px;
        color: #a8b7d0;
        font-size: 15px;
        line-height: 1.7;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 10px;
        color: #dbe7fa;
        font-size: 13px;
      }

      .dots {
        display: inline-flex;
        gap: 5px;
      }

      .dots i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #62d9ff;
        animation: dot-pulse 1.2s ease-in-out infinite;
      }

      .dots i:nth-child(2) { animation-delay: 160ms; }
      .dots i:nth-child(3) { animation-delay: 320ms; }

      .progress-track {
        height: 5px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(130, 161, 211, 0.16);
      }

      .progress-bar {
        width: 46%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2876ff, #62d9ff, #7446ff);
        box-shadow: 0 0 18px rgba(82, 141, 255, 0.62);
        animation: progress-run 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes card-enter {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes logo-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-6px) scale(1.018); }
      }

      @keyframes ring-spin { to { transform: rotate(360deg); } }

      @keyframes progress-run {
        from { transform: translateX(-115%); }
        to { transform: translateX(245%); }
      }

      @keyframes dot-pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.72); }
        50% { opacity: 1; transform: scale(1); }
      }

      @keyframes light-sweep {
        0%, 28% { transform: translateX(-100%); }
        72%, 100% { transform: translateX(100%); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash-card" aria-label="E-Shop PC 正在启动">
      <div class="logo-stage">
        <img class="app-icon" src="./assets/app-icon.png" alt="E-Shop" />
      </div>
      <section class="content">
        <p class="eyebrow">E-SHOP DESKTOP EXPERIENCE</p>
        <h1>E-Shop PC</h1>
        <p class="subtitle">连接商品、订单与安全支付服务<br />为你准备完整的桌面购物体验</p>
        <div class="status-row">
          <span>正在启动商城</span>
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-bar"></div>
        </div>
      </section>
    </main>
  </body>
</html>
