<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Shop 暂时无法连接</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        background: #07111f;
        color: #f7f9ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 10%, rgba(54, 125, 255, 0.24), transparent 32%),
          radial-gradient(circle at 85% 75%, rgba(125, 63, 255, 0.18), transparent 32%),
          #07111f;
      }

      main {
        width: min(92vw, 620px);
        padding: 44px;
        border: 1px solid rgba(137, 176, 255, 0.22);
        border-radius: 24px;
        background: rgba(14, 28, 52, 0.92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #64a6ff;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 { margin: 0 0 14px; font-size: 34px; }
      .message { margin: 0 0 10px; color: #adbbd2; line-height: 1.75; }
      .detail { margin: 0 0 28px; color: #6f83a5; font-size: 13px; }

      button {
        width: 100%;
        padding: 14px 20px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #2876ff, #7446ff);
        color: white;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(45, 110, 255, 0.28);
      }

      button:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">E-Shop PC</p>
      <h1>商城暂时无法连接</h1>
      <p class="message">请检查网络或确认服务器已启动，然后重新尝试。</p>
      <p class="detail" id="error-detail">正在读取错误信息……</p>
      <button id="retry-button" type="button">重新连接</button>
    </main>
    <script src="./offline.js"></script>
  </body>
</html>
