services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eshop}
      MYSQL_USER: ${MYSQL_USER:-eshop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eshop123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eshop}
      MYSQL_USER: ${MYSQL_USER:-eshop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eshop123}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NICKNAME: ${BOOTSTRAP_ADMIN_NICKNAME:-系统管理员}
      ORDER_TIMEOUT_ENABLED: ${ORDER_TIMEOUT_ENABLED:-true}
      ORDER_TIMEOUT_MINUTES: ${ORDER_TIMEOUT_MINUTES:-30}
      ORDER_TIMEOUT_BATCH_SIZE: ${ORDER_TIMEOUT_BATCH_SIZE:-100}
      ORDER_TIMEOUT_INITIAL_DELAY_MS: ${ORDER_TIMEOUT_INITIAL_DELAY_MS:-15000}
      ORDER_TIMEOUT_SCAN_DELAY_MS: ${ORDER_TIMEOUT_SCAN_DELAY_MS:-60000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\\\"status\\\":\\\"UP\\\"' <&3\""
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
